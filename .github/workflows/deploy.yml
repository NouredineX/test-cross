name: Deploy Travelling Through Morocco to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Travelling Through Morocco
    runs-on: ubuntu-latest

    steps:
      - name: Verify repository identity
        run: |
          if [ "${{ github.repository }}" != "NouredineX/test-cross" ]; then
            echo "ERROR: Wrong repository. Deployment blocked."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Deploy Travelling Through Morocco
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST }}
          ARGS: "-rlgoDzvO"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/opt/antigravity/travellingthroughmorocco.com/"
          EXCLUDE: "/node_modules/, /.git/, /.github/, /scratch/"

      - name: Restart Travelling Through Morocco
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.TEST }}
          script: |
            cd /opt/antigravity/travellingthroughmorocco.com
            npm install --omit=dev
            pm2 restart travelling-through-morocco || pm2 start npm --name "travelling-through-morocco" -- start
